[package]
name = "solar-schema"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Solar SpacetimeDB world-store schema — per-chunk world tables streamed by the JVM."

[dependencies]
# Must match the host module's SpacetimeDB version exactly — the #[table] macro
# emits version-specific descriptors that the module links into its WASM binary.
spacetimedb = "=2.8.1"
